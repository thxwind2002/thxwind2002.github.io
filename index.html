<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>3D 香港六合彩搞珠機（螢幕控制 3D 視覺位置）</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: radial-gradient(circle at 50% 0%, #1e293b, #060913 85%);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 8px;
    }
    .app {
      width: 100%;
      max-width: 450px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 4px 6px;
      gap: 6px;
    }
    .top-bar h1 {
      margin: 0;
      font-size: 1.02rem;
      letter-spacing: 0.4px;
    }
    .top-right {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .top-btn {
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 4px 8px;
      cursor: pointer;
    }
    .top-btn:active { transform: scale(0.96); }

    /* 紅色提示文字樣式（方便日後修改免費試用、10秒廣告、廣告位置） */
    .red-highlight {
      color: #f87171 !important;
      font-weight: 800;
    }

    .quota-strip {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 6px 10px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      font-size: 0.74rem;
    }
    .quota-badge {
      color: #38bdf8;
      font-weight: 800;
    }
    .quota-num {
      color: #fbbf24;
      font-weight: 800;
    }
    .quota-sub {
      color: #94a3b8;
      font-size: 0.68rem;
    }

    .canvas-box {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      background: linear-gradient(180deg, #cbd5e1 0%, #94a3b8 70%, #1e293b 70%, #090d16 100%);
      border-radius: 16px;
      border: 2px solid #475569;
      overflow: hidden;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.65);
      touch-action: none;
    }
    canvas#scene3d {
      width: 360px;
      height: 420px;
      max-width: 100%;
      display: block;
      cursor: grab;
    }
    canvas#scene3d:active {
      cursor: grabbing;
    }
    .cam-hint {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.72);
      color: #e2e8f0;
      font-size: 0.66rem;
      padding: 2px 9px;
      border-radius: 999px;
      pointer-events: none;
      white-space: nowrap;
      border: 1px solid rgba(148, 163, 184, 0.35);
    }

    .panel {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 9px 10px;
      margin-top: 8px;
    }
    .panel.hidden {
      display: none;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }
    .grid-2:last-child { margin-bottom: 0; }
    .field {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .field label {
      font-size: 0.72rem;
      color: #cbd5e1;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
    }
    .field label span.val { color: #fbbf24; }
    input[type="range"] {
      width: 100%;
      accent-color: #38bdf8;
      margin: 2px 0;
    }
    .num-input-box {
      display: flex;
      align-items: center;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 7px;
      padding: 3px 8px;
    }
    .num-input-box input {
      width: 100%;
      background: transparent;
      border: none;
      color: #fbbf24;
      font-size: 0.9rem;
      font-weight: 800;
      text-align: center;
      outline: none;
    }
    .num-input-box span {
      font-size: 0.74rem;
      color: #94a3b8;
      margin-left: 4px;
    }
    .seg-group {
      display: flex;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 7px;
      overflow: hidden;
    }
    .seg-btn {
      flex: 1;
      padding: 6px 4px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 0.73rem;
      font-weight: 800;
      cursor: pointer;
    }
    .seg-btn.active {
      background: #2563eb;
      color: #fff;
    }

    .mass-section {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 9px;
      padding: 8px;
      margin-bottom: 8px;
    }
    .mass-top-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 6px;
    }
    .mass-title {
      font-size: 0.72rem;
      color: #cbd5e1;
      font-weight: 700;
    }
    .all-mass-box {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .all-mass-box.hidden {
      display: none;
    }
    .all-mass-box input {
      width: 78px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 6px;
      color: #fbbf24;
      font-size: 0.84rem;
      font-weight: 800;
      text-align: center;
      padding: 4px 6px;
      outline: none;
    }
    .random-mass-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 7px;
      padding: 7px 8px;
    }
    .random-mass-box.hidden {
      display: none;
    }
    .random-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .random-desc {
      font-size: 0.7rem;
      color: #cbd5e1;
      line-height: 1.35;
    }
    .random-btn {
      background: linear-gradient(180deg, #0ea5e9, #0284c7);
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 6px 10px;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.35);
    }
    .random-btn:active {
      transform: scale(0.96);
    }
    .random-summary {
      font-size: 0.68rem;
      color: #fbbf24;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
    }
    .random-result-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      max-height: 145px;
      overflow-y: auto;
      padding-right: 2px;
    }
    .random-ball-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 3px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .random-mass-val {
      font-size: 0.7rem;
      font-weight: 800;
      color: #fbbf24;
    }

    .per-ball-box {
      margin-top: 6px;
    }
    .per-ball-box.hidden {
      display: none;
    }
    .per-ball-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }
    .per-ball-toolbar input {
      width: 72px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 6px;
      color: #fbbf24;
      font-size: 0.78rem;
      font-weight: 800;
      text-align: center;
      padding: 3px 5px;
      outline: none;
    }
    .apply-btn {
      background: #334155;
      color: #e2e8f0;
      border: 1px solid #475569;
      border-radius: 6px;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 4px 7px;
      cursor: pointer;
    }
    .ball-mass-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      max-height: 150px;
      overflow-y: auto;
      padding-right: 2px;
    }
    .ball-mass-item {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 3px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .ball-mass-badge {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      color: #fff;
      font-size: 0.62rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ball-mass-item input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 4px;
      color: #fbbf24;
      font-size: 0.7rem;
      font-weight: 800;
      text-align: center;
      padding: 2px 1px;
      outline: none;
    }

    .status-bar {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 9px;
      padding: 7px 10px;
      text-align: center;
      font-size: 0.78rem;
      font-weight: 700;
      color: #fbbf24;
      margin-top: 7px;
    }
    .status-bar.hidden {
      display: none;
    }

    .result-box {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 8px 10px;
      margin-top: 7px;
    }
    .result-head {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: #94a3b8;
      margin-bottom: 5px;
    }
    .balls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-height: 36px;
      flex-wrap: wrap;
    }
    .res-ball {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset -3px -3px 6px rgba(0,0,0,0.5), 0 3px 6px rgba(0,0,0,0.45);
    }
    .res-ball::after {
      content: attr(data-num);
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      color: #0f172a;
      font-size: 0.72rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .plus { font-weight: 800; color: #e2e8f0; }
    .order-text {
      margin-top: 5px;
      font-size: 0.7rem;
      color: #cbd5e1;
      text-align: center;
    }

    .actions {
      width: 100%;
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .act-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 11px;
      font-size: 0.96rem;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
    }
    #startBtn {
      background: linear-gradient(180deg, #ef4444, #b91c1c);
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.45);
    }
    #startBtn:disabled { background: #475569; box-shadow: none; cursor: not-allowed; }
    #resetBtn { flex: 0.42; background: #334155; }

    .unlock-bar {
      width: 100%;
      display: flex;
      gap: 8px;
      margin-top: 7px;
    }
    .unlock-btn {
      width: 100%;
      padding: 9px 8px;
      border-radius: 10px;
      border: 1px solid #475569;
      font-size: 0.78rem;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
    }
    .unlock-btn:active { transform: scale(0.98); }
    .ad-unlock-btn {
      background: linear-gradient(180deg, #0284c7, #0369a1);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.82);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 99;
    }
    .modal-backdrop.hidden {
      display: none;
    }
    .modal-card {
      width: 100%;
      max-width: 360px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.75);
    }
    .modal-title {
      margin: 0 0 8px;
      font-size: 0.98rem;
      font-weight: 800;
      color: #fbbf24;
    }
    .ad-screen {
      background: #0f172a;
      border: 1px solid #38bdf8;
      border-radius: 10px;
      padding: 14px 10px;
      text-align: center;
      margin-bottom: 10px;
    }
    .ad-countdown {
      font-size: 1.35rem;
      font-weight: 800;
      color: #38bdf8;
      margin: 4px 0;
    }
    .progress-track {
      width: 100%;
      height: 7px;
      background: #334155;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: #38bdf8;
      transition: width 0.2s linear;
    }
    .modal-actions {
      display: flex;
      gap: 8px;
    }
    .modal-btn {
      flex: 1;
      padding: 9px;
      border-radius: 8px;
      border: none;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
    }
    .modal-btn.primary {
      background: #16a34a;
      color: #fff;
    }
    .modal-btn.primary:disabled {
      background: #475569;
      color: #cbd5e1;
      cursor: not-allowed;
    }
    .modal-btn.secondary {
      background: #334155;
      color: #e2e8f0;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top-bar">
      <h1>MARK SIX 3D 搞珠機</h1>
      <div class="top-right">
        <button type="button" class="top-btn" onclick="resetCamera()">重設視角</button>
        <button type="button" class="top-btn" id="togglePanelBtn" onclick="toggleSettingsPanel()">隱藏設定</button>
      </div>
    </div>

    <div class="quota-strip">
      <div>
        <span class="quota-badge">剩餘試用次數：</span>
        <span class="quota-num" id="quotaCountText">2 次</span>
      </div>
      <div class="quota-sub red-highlight" id="dailyPlanText">每天重設 2 次免費試用</div>
    </div>

    <div class="canvas-box" id="canvasBox">
      <canvas id="scene3d" width="360" height="420"></canvas>
      <div class="cam-hint" id="camHint">單指滑動旋轉 3D 視角・雙指縮放</div>
    </div>

    <div class="panel" id="settingsPanel">
      <div class="grid-2">
        <div class="field">
          <label for="stirSecInput">每次搞珠時間（自訂秒數）</label>
          <div class="num-input-box">
            <input id="stirSecInput" type="number" min="0.2" max="60" step="0.1" value="3.0" />
            <span>秒</span>
          </div>
        </div>
        <div class="field">
          <label>出球管方向（事前選擇）</label>
          <div class="seg-group">
            <button type="button" class="seg-btn active" id="outLeft" onclick="setExitSide('left')">⬅ 左邊管</button>
            <button type="button" class="seg-btn" id="outRight" onclick="setExitSide('right')">右邊管 ➡</button>
          </div>
        </div>
      </div>

      <div class="mass-section">
        <div class="mass-top-row">
          <span class="mass-title">珠的重量設定</span>
          <div class="seg-group">
            <button type="button" class="seg-btn active" id="massModeAll" onclick="setMassMode('all')">1. 統一重量</button>
            <button type="button" class="seg-btn" id="massModeEach" onclick="setMassMode('each')">2. 分別 49 粒</button>
            <button type="button" class="seg-btn" id="massModeRandom" onclick="setMassMode('random')">3. 隨機重量</button>
          </div>
        </div>

        <div class="all-mass-box" id="allMassBox">
          <span style="font-size: 0.72rem; color: #94a3b8;">全部 49 粒珠重量：</span>
          <input id="allMassInput" type="number" min="0.2" max="5.0" step="0.1" value="1.0" oninput="syncParams()" />
        </div>

        <div class="random-mass-box hidden" id="randomMassBox">
          <div class="random-header">
            <span class="random-desc">49 粒珠各自隨機（0.3 – 2.5，一位小數）</span>
            <button type="button" class="random-btn" onclick="randomizeAllBallMasses()">🎲 隨機重量</button>
          </div>
          <div class="random-summary">
            <span>隨機後重量（1–49 號）</span>
            <span id="randomAvgText">平均：—</span>
          </div>
          <div class="random-result-grid" id="randomResultGrid"></div>
        </div>

        <div class="per-ball-box hidden" id="perBallBox">
          <div class="per-ball-toolbar">
            <span style="font-size: 0.68rem; color: #94a3b8;">各自輸入 1–49 號重量：</span>
            <div style="display: flex; align-items: center; gap: 4px;">
              <input id="batchFillMassInput" type="number" min="0.2" max="5.0" step="0.1" value="1.0" />
              <button type="button" class="apply-btn" onclick="fillAllIndividualMass()">全部套用</button>
            </div>
          </div>
          <div class="ball-mass-grid" id="ballMassGrid"></div>
        </div>
      </div>

      <div class="grid-2">
        <div class="field">
          <label>攪拌速度 <span class="val" id="speedVal">1.0x</span></label>
          <input id="speedInput" type="range" min="0.4" max="2.5" step="0.1" value="1.0" oninput="syncParams()" />
        </div>
        <div class="field">
          <label>攪拌力度 <span class="val" id="forceVal">1.0x</span></label>
          <input id="forceInput" type="range" min="0.4" max="2.5" step="0.1" value="1.0" oninput="syncParams()" />
        </div>
      </div>
    </div>

    <div class="status-bar hidden" id="statusBar"></div>

    <div class="result-box">
      <div class="result-head">
        <span>攪出號碼（正碼由小到大）</span>
        <span>特別號碼</span>
      </div>
      <div class="balls-row" id="ballsRow"></div>
      <div class="order-text" id="orderText">出球順序：—</div>
    </div>

    <div class="actions">
      <button type="button" class="act-btn" id="startBtn" onclick="startDraw()">開始開彩</button>
      <button type="button" class="act-btn" id="resetBtn" onclick="resetMachine()">重新開始</button>
    </div>

    <div class="unlock-bar">
      <button type="button" class="unlock-btn ad-unlock-btn red-highlight" id="adBtn" onclick="openAdModal()">📺 睇 10 秒廣告（+1 次）</button>
    </div>
  </div>

  <!-- 10 秒廣告視窗 -->
  <div class="modal-backdrop hidden" id="adModal">
    <div class="modal-card">
      <h2 class="modal-title red-highlight">睇 10 秒廣告</h2>
      <div class="ad-screen">
        <div class="red-highlight" style="font-size: 0.78rem;">廣告播放位置：請睇 10 秒廣告內容以增加 1 次試用</div>
        <div class="ad-countdown red-highlight" id="adCountdownText">10 秒</div>
        <div class="red-highlight" style="font-size: 0.7rem;">（廣告播放位置示範區，可替換為真實廣告內容或 SDK）</div>
        <div class="progress-track">
          <div class="progress-fill" id="adProgressBar"></div>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="modal-btn secondary" onclick="closeAdModal()">取消</button>
        <button type="button" class="modal-btn primary" id="claimAdBtn" disabled onclick="claimAdReward()">完成領取 +1 次</button>
      </div>
    </div>
  </div>

  <script>
    var canvas = document.getElementById("scene3d");
    var ctx = canvas ? canvas.getContext("2d") : null;
    var statusBar = document.getElementById("statusBar");
    var ballsRow = document.getElementById("ballsRow");
    var orderText = document.getElementById("orderText");
    var startBtn = document.getElementById("startBtn");
    var resetBtn = document.getElementById("resetBtn");
    var stirSecInput = document.getElementById("stirSecInput");
    var settingsPanel = document.getElementById("settingsPanel");
    var togglePanelBtn = document.getElementById("togglePanelBtn");
    var camHint = document.getElementById("camHint");
    var allMassBox = document.getElementById("allMassBox");
    var randomMassBox = document.getElementById("randomMassBox");
    var randomResultGrid = document.getElementById("randomResultGrid");
    var randomAvgText = document.getElementById("randomAvgText");
    var perBallBox = document.getElementById("perBallBox");
    var ballMassGrid = document.getElementById("ballMassGrid");
    var quotaCountText = document.getElementById("quotaCountText");
    var dailyPlanText = document.getElementById("dailyPlanText");

    var adModal = document.getElementById("adModal");
    var adCountdownText = document.getElementById("adCountdownText");
    var adProgressBar = document.getElementById("adProgressBar");
    var claimAdBtn = document.getElementById("claimAdBtn");

    /* =========================================================
       防改次數主邏輯（防直接修改 localStorage + 防系統時間倒退）
       ========================================================= */
    var STORAGE_KEY = "marksix_3d_quota_guarded_v1";
    var DAILY_FREE_RESET_COUNT = 2;
    var INTEGRITY_SALT = "M6_3D_GUARD_2026_HK";
    var CLOCK_SKEW_TOLERANCE_MS = 5 * 60 * 1000;

    function computeQuotaChecksum(trials, lastResetDate, lastSeenMs) {
      var raw = String(trials) + "|" + String(lastResetDate) + "|" + String(lastSeenMs) + "|" + INTEGRITY_SALT;
      var h1 = 0x811c9dc5;
      var h2 = 0x01000193;
      for (var i = 0; i < raw.length; i++) {
        var code = raw.charCodeAt(i);
        h1 ^= code;
        h1 = Math.imul(h1, 0x01000193) >>> 0;
        h2 = Math.imul(h2 ^ code, 0x85ebca6b) >>> 0;
      }
      return h1.toString(16).padStart(8, "0") + "-" + h2.toString(16).padStart(8, "0");
    }

    function getTodayString() {
      var now = new Date();
      var y = now.getFullYear();
      var m = String(now.getMonth() + 1).padStart(2, "0");
      var d = String(now.getDate()).padStart(2, "0");
      return y + "-" + m + "-" + d;
    }

    var quotaState = {
      remainingTrials: DAILY_FREE_RESET_COUNT,
      lastResetDate: "",
      lastSeenMs: 0
    };

    function showGuardNotice(msg) {
      if (!statusBar) return;
      statusBar.classList.remove("hidden");
      statusBar.style.color = "#fca5a5";
      statusBar.textContent = msg;
    }

    function loadQuotaState() {
      var today = getTodayString();
      var nowMs = Date.now();
      var hasStored = false;
      var tampered = false;
      var clockRolledBack = false;

      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          hasStored = true;
          var parsed = JSON.parse(raw);
          var trials = parsed && typeof parsed.remainingTrials === "number" ? parsed.remainingTrials : NaN;
          var resetDate = parsed && typeof parsed.lastResetDate === "string" ? parsed.lastResetDate : "";
          var seenMs = parsed && typeof parsed.lastSeenMs === "number" ? parsed.lastSeenMs : NaN;
          var sig = parsed && typeof parsed.sig === "string" ? parsed.sig : "";

          var expectedSig = computeQuotaChecksum(trials, resetDate, seenMs);
          if (
            isNaN(trials) ||
            !isFinite(trials) ||
            Math.floor(trials) !== trials ||
            trials < 0 ||
            trials > 9999 ||
            !resetDate ||
            isNaN(seenMs) ||
            sig !== expectedSig
          ) {
            tampered = true;
          } else {
            quotaState.remainingTrials = trials;
            quotaState.lastResetDate = resetDate;
            quotaState.lastSeenMs = seenMs;
          }
        }
      } catch (_e) {
        tampered = true;
      }

      if (!hasStored) {
        quotaState.remainingTrials = DAILY_FREE_RESET_COUNT;
        quotaState.lastResetDate = today;
        quotaState.lastSeenMs = nowMs;
        saveQuotaState();
      } else if (tampered) {
        quotaState.remainingTrials = 0;
        quotaState.lastResetDate = today;
        quotaState.lastSeenMs = Math.max(quotaState.lastSeenMs || 0, nowMs);
        saveQuotaState();
        showGuardNotice("偵測到儲存次數資料異常，已重設為安全狀態，可睇 10 秒廣告補次數。");
      } else {
        if (nowMs + CLOCK_SKEW_TOLERANCE_MS < quotaState.lastSeenMs) {
          clockRolledBack = true;
          quotaState.lastSeenMs = nowMs;
          saveQuotaState();
          showGuardNotice("偵測到系統時間倒退，已暫停當日自動重設，請檢查裝置時間。");
        } else {
          if (nowMs > quotaState.lastSeenMs) {
            quotaState.lastSeenMs = nowMs;
          }
          if (quotaState.lastResetDate !== today) {
            quotaState.lastResetDate = today;
            quotaState.remainingTrials = Math.max(quotaState.remainingTrials, DAILY_FREE_RESET_COUNT);
          }
          saveQuotaState();
          if (!clockRolledBack) {
            hideStatus();
          }
        }
      }

      renderQuotaUI();
    }

    function saveQuotaState() {
      var safeTrials = Math.max(0, Math.floor(quotaState.remainingTrials || 0));
      var safeDate = quotaState.lastResetDate || getTodayString();
      var safeSeen = Math.max(0, Math.floor(quotaState.lastSeenMs || Date.now()));
      var payload = {
        remainingTrials: safeTrials,
        lastResetDate: safeDate,
        lastSeenMs: safeSeen,
        sig: computeQuotaChecksum(safeTrials, safeDate, safeSeen)
      };
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      } catch (_e) {}
    }

    function renderQuotaUI() {

    var RED = new Set([1,2,7,8,12,13,18,19,23,24,29,30,34,35,40,45,46]);
    var BLUE = new Set([3,4,9,10,14,15,20,25,26,31,36,37,41,42,47,48]);

    function getBallColor(num) {
      if (RED.has(num)) return { main: "#dc2626", light: "#fca5a5", dark: "#7f1d1d" };
      if (BLUE.has(num)) return { main: "#2563eb", light: "#93c5fd", dark: "#1e3a8a" };
      return { main: "#16a34a", light: "#86efac", dark: "#14532d" };
    }

    // 地心吸力固定為 1（隱藏於程式內）
    var GRAVITY_FIXED = 1.0;

    // 圓球體直徑 = 15 * 珠直徑
    var CX = 180;
    var CY = 248;
    var BALL_R = 6.8;
    var BALL_DIAMETER = BALL_R * 2;
    var SPHERE_DIAMETER = BALL_DIAMETER * 15;
    var SPHERE_R = SPHERE_DIAMETER / 2;
    var SPHERE_TOP_Y = CY - SPHERE_R;
    var SPHERE_BOTTOM_Y = CY + SPHERE_R;
    var CYL_W = BALL_DIAMETER + 2.6;

    // 十字型攪珠棒放喺圓球體 1/20 高度
    var CROSS_Y = SPHERE_BOTTOM_Y - SPHERE_DIAMETER / 20;
    var dyFromCenter = CROSS_Y - CY;
    var halfChordAtCrossY = Math.sqrt(Math.max(0, SPHERE_R * SPHERE_R - dyFromCenter * dyFromCenter));
    var wallGap = BALL_DIAMETER / 10;
    var maxCrossHalfSpan = Math.max(10, halfChordAtCrossY - wallGap);

    // 5 欄透明圓柱：底部 = 圓球體頂部
    var NUM_COLS = 5;
    var MAX_PER_COL = 10;
    var COL_SPACING = BALL_DIAMETER * 1.42;
    var COL_TUBE_W = BALL_DIAMETER + 2;
    var COL_BOTTOM_Y = SPHERE_TOP_Y;
    var COL_STEP_Y = BALL_DIAMETER * 1.04;
    var COL_TUBE_H = MAX_PER_COL * COL_STEP_Y + BALL_R * 0.8;
    var COL_TOP_Y = COL_BOTTOM_Y - COL_TUBE_H;

    // 3D 視覺位置控制器
    var camYaw = 0;
    var camPitch = 0;
    var camZoom = 1.0;

    var isDragging = false;
    var lastTouchX = 0;
    var lastTouchY = 0;
    var initialPinchDist = 0;
    var initialZoom = 1.0;

    function updateCamHint() {
      if (!camHint) return;
      var yawDeg = Math.round((camYaw * 180) / Math.PI);
      var pitchDeg = Math.round((camPitch * 180) / Math.PI);
      camHint.textContent = "視角：水平 " + yawDeg + "° / 俯仰 " + pitchDeg + "° / 縮放 " + camZoom.toFixed(1) + "x";
    }

    function resetCamera() {
      camYaw = 0;
      camPitch = 0;
      camZoom = 1.0;
      if (camHint) camHint.textContent = "單指滑動旋轉 3D 視角・雙指縮放";
    }

    function project3D(wx, wy, wz) {
      var dx = wx - CX;
      var dy = wy - CY;
      var dz = wz || 0;

      var cosY = Math.cos(camYaw);
      var sinY = Math.sin(camYaw);
      var x1 = dx * cosY - dz * sinY;
      var z1 = dx * sinY + dz * cosY;

      var cosP = Math.cos(camPitch);
      var sinP = Math.sin(camPitch);
      var y2 = dy * cosP - z1 * sinP;
      var z2 = dy * sinP + z1 * cosP;

      var fov = 560;
      var persp = fov / (fov - z2);
      var scale = persp * camZoom;

      return {
        x: CX + x1 * scale,
        y: CY + y2 * scale,
        z: z2,
        scale: scale
      };
    }

    if (canvas) {
      canvas.addEventListener("touchstart", function (e) {
        if (e.touches.length === 1) {
          isDragging = true;
          lastTouchX = e.touches[0].clientX;
          lastTouchY = e.touches[0].clientY;
        } else if (e.touches.length === 2) {
          isDragging = false;
          initialPinchDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          initialZoom = camZoom;
        }
      }, { passive: false });

      canvas.addEventListener("touchmove", function (e) {
        e.preventDefault();
        if (e.touches.length === 1 && isDragging) {
          var dx = e.touches[0].clientX - lastTouchX;
          var dy = e.touches[0].clientY - lastTouchY;
          lastTouchX = e.touches[0].clientX;
          lastTouchY = e.touches[0].clientY;
          camYaw += dx * 0.012;
          camPitch = Math.max(-1.15, Math.min(1.15, camPitch + dy * 0.012));
          updateCamHint();
        } else if (e.touches.length === 2 && initialPinchDist > 0) {
          var dist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          camZoom = Math.max(0.65, Math.min(1.85, initialZoom * (dist / initialPinchDist)));
          updateCamHint();
        }
      }, { passive: false });

      canvas.addEventListener("touchend", function () {
        isDragging = false;
        initialPinchDist = 0;
      });

      canvas.addEventListener("mousedown", function (e) {
        isDragging = true;
        lastTouchX = e.clientX;
        lastTouchY = e.clientY;
      });

      canvas.addEventListener("wheel", function (e) {
        e.preventDefault();
        camZoom = Math.max(0.65, Math.min(1.85, camZoom - e.deltaY * 0.001));
        updateCamHint();
      }, { passive: false });
    }

    window.addEventListener("mousemove", function (e) {
      if (!isDragging) return;
      var dx = e.clientX - lastTouchX;
      var dy = e.clientY - lastTouchY;
      lastTouchX = e.clientX;
      lastTouchY = e.clientY;
      camYaw += dx * 0.012;
      camPitch = Math.max(-1.15, Math.min(1.15, camPitch + dy * 0.012));
      updateCamHint();
    });

    window.addEventListener("mouseup", function () {
      isDragging = false;
    });

    var massMode = "all";
    var allMassVal = 1.0;
    var individualMasses = [];
    for (var mInit = 0; mInit <= 49; mInit++) {
      individualMasses[mInit] = 1.0;
    }

    var mixSpeedVal = 1.0;
    var mixForceVal = 1.0;
    var exitSide = "left";

    var phase = "READY";
    var balls = [];
    var drawnOrder = [];
    var storedLeftBalls = [];
    var storedRightBalls = [];
    var isRunning = false;

    var crossAngle = 0;
    var cylTopY = SPHERE_BOTTOM_Y - 5;
    var carriedBall = null;
    var exitingBall = null;

    function randomMassOneDecimal() {
      var steps = Math.floor(Math.random() * 23) + 3;
      return Math.round(steps) / 10;
    }

    function renderRandomMassDisplay() {
      if (!randomResultGrid || !randomAvgText) return;
      randomResultGrid.innerHTML = "";
      var sum = 0;

      for (var n = 1; n <= 49; n++) {

        card.appendChild(mText);

      randomAvgText.textContent = "平均：" + (sum / 49).toFixed(2);

    function syncIndividualInputsFromArray() {
      if (!ballMassGrid) return;
      var inputs = ballMassGrid.querySelectorAll("input");
      for (var i = 0; i < inputs.length; i++) {

    function buildIndividualMassInputs() {
      if (!ballMassGrid) return;
      ballMassGrid.innerHTML = "";
      for (var n = 1; n <= 49; n++) {
        var item = document.createElement("div");

        inp.addEventListener("input", function () {

          var val = parseFloat(this.value);
          if (isNaN(val) || val <= 0) val = 1.0;
          individualMasses[num] = Math.round(val * 10) / 10;
          renderRandomMassDisplay();
          applyMassesToActiveBalls();
        });

        item.appendChild(badge);
        item.appendChild(inp);
        ballMassGrid.appendChild(item);
      }
      renderRandomMassDisplay();

    function getMassForBall(num) {
      if (massMode === "each" || massMode === "random") {
        var v = individualMasses[num];
        return (typeof v === "number" && !isNaN(v) && v > 0) ? v : 1.0;
      }
      return allMassVal;
    }

    function applyMassesToActiveBalls() {
      for (var i = 0; i < balls.length; i++) {
        balls[i].mass = getMassForBall(balls[i].num);

    function randomizeAllBallMasses() {

      applyMassesToActiveBalls();

    function setMassMode(mode) {

      document.getElementById("massModeEach").classList.toggle("active", mode === "each");
      document.getElementById("massModeRandom").classList.toggle("active", mode === "random");

      allMassBox.classList.toggle("hidden", mode !== "all");
      randomMassBox.classList.toggle("hidden", mode !== "random");

    function toggleSettingsPanel() {
      var isHidden = settingsPanel.classList.toggle("hidden");
      togglePanelBtn.textContent = isHidden ? "顯示設定" : "隱藏設定";
    }

    function syncParams() {
      var rawAllMass = parseFloat(document.getElementById("allMassInput").value);
      allMassVal = (!isNaN(rawAllMass) && rawAllMass > 0) ? rawAllMass : 1.0;
      mixSpeedVal = parseFloat(document.getElementById("speedInput").value);
      mixForceVal = parseFloat(document.getElementById("forceInput").value);

      document.getElementById("speedVal").textContent = mixSpeedVal.toFixed(1) + "x";
      document.getElementById("forceVal").textContent = mixForceVal.toFixed(1) + "x";

    function setExitSide(side) {
      if (isRunning) return;
      exitSide = side;
      document.getElementById("outLeft").classList.toggle("active", side === "left");
      document.getElementById("outRight").classList.toggle("active", side === "right");
      hideStatus();
    }

    /* =========================================================
       1-49 珠排列次序：由左至右、下至上排列
       （第 1 欄最底 01 至最頂 10，第 2 欄最底 11 至最頂 20 ... 第 5 欄最底 41 至最頂 49）
       ========================================================= */
    function arrangeFiveColumnsOnTop() {
      balls = [];
      drawnOrder = [];
      storedLeftBalls = [];
      storedRightBalls = [];
      carriedBall = null;
      exitingBall = null;
      cylTopY = SPHERE_BOTTOM_Y - 5;
      phase = "READY";
      ballsRow.innerHTML = "";
      orderText.textContent = "出球順序：—";

      var totalWidth = (NUM_COLS - 1) * COL_SPACING;
      var startX = CX - totalWidth / 2;
      var bottomRowY = COL_TOP_Y + BALL_R * 0.9 + (MAX_PER_COL - 1) * COL_STEP_Y;

      var num = 1;
      for (var c = 0; c < NUM_COLS; c++) {
        var countInCol = Math.min(MAX_PER_COL, 49 - num + 1);
        for (var r = 0; r < countInCol; r++) {
          if (num > 49) break;
          var yPos = bottomRowY - r * COL_STEP_Y;
          balls.push({
            num: num,
            color: getBallColor(num),
            x: startX + c * COL_SPACING,
            y: yPos,
            z: 0,
            vx: 0,
            vy: 0,
            vz: 0,
            mass: getMassForBall(num),
            inSphere: false
          });
          num++;
        }
      }
    }

    function resetMachine() {
      if (isRunning) return;
      hideStatus();
      arrangeFiveColumnsOnTop();
    }

    function updateCrossStirrer() {
      if (phase !== "STIRRING") return;

      crossAngle += 0.085 * mixSpeedVal;

      var cosA = Math.cos(crossAngle);
      var cosB = Math.cos(crossAngle + Math.PI / 2);
      var armReach = Math.min(maxCrossHalfSpan, Math.max(Math.abs(cosA), Math.abs(cosB)) * maxCrossHalfSpan);

      for (var i = 0; i < balls.length; i++) {
        var b = balls[i];
        if (!b.inSphere) continue;
        var nearCrossY = Math.abs(b.y - CROSS_Y) <= BALL_R + 4;
        var horizDist = Math.hypot(b.x - CX, b.z || 0);
        if (nearCrossY && horizDist <= armReach + BALL_R * 0.5) {
          var dirSign = b.x >= CX ? 1 : -1;
          var kick = (2.1 * mixForceVal) / Math.max(0.3, b.mass);
          b.vx += dirSign * kick + ((Math.random() - 0.5) * 1.0 * mixForceVal) / b.mass;
          b.vy -= (2.4 * mixForceVal * GRAVITY_FIXED) / Math.max(0.3, b.mass);
          b.vz += ((Math.random() - 0.5) * 1.6 * mixForceVal) / b.mass;
        }
      }
    }

    function updatePhysics() {
      updateCrossStirrer();
      if (phase === "READY") return;

      var activeAir = (phase === "STIRRING");

      for (var i = 0; i < balls.length; i++) {
        var b = balls[i];
        b.mass = getMassForBall(b.num);

        if (!b.inSphere) {
          b.vy += GRAVITY_FIXED * 0.35;
          b.y += b.vy;
          if (b.y >= SPHERE_TOP_Y + BALL_R + 2) {
            b.inSphere = true;
            b.vx = (Math.random() - 0.5) * 2.8 * mixForceVal;
            b.vz = (Math.random() - 0.5) * 2.8 * mixForceVal;
          }
          continue;
        }

        b.vy += GRAVITY_FIXED * 0.25;

        if (activeAir) {
          var liftAccel = (0.46 * mixForceVal * GRAVITY_FIXED) / Math.max(0.3, b.mass);
          var swirlAccel = (0.31 * mixForceVal * mixSpeedVal) / Math.max(0.3, b.mass);
          var dx = b.x - CX;
          var dy = b.y - CY;
          var dist = Math.hypot(dx, dy) || 1;

          b.vx += (-dy / dist) * swirlAccel + ((Math.random() - 0.5) * 0.55 * mixForceVal) / b.mass;
          b.vy += (dx / dist) * swirlAccel - liftAccel;
          b.vz += ((Math.random() - 0.5) * 1.1 * mixSpeedVal) / Math.max(0.3, b.mass);
        }

        b.vx *= 0.985;
        b.vy *= 0.985;
        b.vz *= 0.985;
        b.x += b.vx;
        b.y += b.vy;
        b.z += b.vz;

        var maxR = SPHERE_R - BALL_R;
        var bdx = b.x - CX;
        var bdy = b.y - CY;
        var bdz = b.z || 0;
        var dist3D = Math.hypot(bdx, bdy, bdz);
        if (dist3D > maxR) {
          var nx = bdx / dist3D;
          var ny = bdy / dist3D;
          var nz = bdz / dist3D;
          b.x = CX + nx * maxR;
          b.y = CY + ny * maxR;
          b.z = nz * maxR;
          var dot = b.vx * nx + b.vy * ny + b.vz * nz;
          if (dot > 0) {
            b.vx -= 1.65 * dot * nx;
            b.vy -= 1.65 * dot * ny;
            b.vz -= 1.65 * dot * nz;
          }
        }
      }

      for (var i = 0; i < balls.length; i++) {
        var a = balls[i];
        if (!a.inSphere) continue;
        for (var j = i + 1; j < balls.length; j++) {
          var b2 = balls[j];
          if (!b2.inSphere) continue;
          var cdx = b2.x - a.x;
          var cdy = b2.y - a.y;
          var cdz = (b2.z || 0) - (a.z || 0);
          var cdist = Math.hypot(cdx, cdy, cdz);
          var minDist = BALL_DIAMETER;
          if (cdist > 0 && cdist < minDist) {
            var cnx = cdx / cdist;
            var cny = cdy / cdist;
            var cnz = cdz / cdist;
            var overlap = (minDist - cdist) * 0.5;
            a.x -= cnx * overlap;
            a.y -= cny * overlap;
            a.z -= cnz * overlap;
            b2.x += cnx * overlap;
            b2.y += cny * overlap;
            b2.z += cnz * overlap;

            var dvx = b2.vx - a.vx;
            var dvy = b2.vy - a.vy;
            var dvz = (b2.vz || 0) - (a.vz || 0);
            var relNormal = dvx * cnx + dvy * cny + dvz * cnz;
            if (relNormal < 0) {
              var totalMass = a.mass + b2.mass;
              var jImp = (-1.75 * relNormal) / totalMass;
              a.vx -= jImp * b2.mass * cnx;
              a.vy -= jImp * b2.mass * cny;
              a.vz -= jImp * b2.mass * cnz;
              b2.vx += jImp * a.mass * cnx;
              b2.vy += jImp * a.mass * cny;
              b2.vz += jImp * a.mass * cnz;
            }
          }
        }
      }
    }

    function drawProjectedBall(wx, wy, wz, baseR, num, colorObj) {
      var p = project3D(wx, wy, wz);
      var r = Math.max(4, baseR * p.scale);

      var grad = ctx.createRadialGradient(
        p.x - r * 0.35,
        p.y - r * 0.35,
        r * 0.12,
        p.x + r * 0.1,
        p.y + r * 0.1,
        r
      );
      grad.addColorStop(0, colorObj.light);
      grad.addColorStop(0.55, colorObj.main);
      grad.addColorStop(1, colorObj.dark);

      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(p.x, p.y, r * 0.6, 0, Math.PI * 2);
      ctx.fillStyle = "#ffffff";
      ctx.fill();

      ctx.beginPath();
      ctx.ellipse(p.x - r * 0.28, p.y - r * 0.34, r * 0.22, r * 0.12, -0.5, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255, 255, 255, 0.65)";
      ctx.fill();

      ctx.fillStyle = "#0f172a";
      ctx.font = "bold " + Math.max(6.5, Math.round(r * 0.88)) + "px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(String(num).padStart(2, "0"), p.x, p.y + 0.4);
    }

    function drawFiveTransparentColumns3D() {
      var totalWidth = (NUM_COLS - 1) * COL_SPACING;
      var startX = CX - totalWidth / 2;

      var cols = [];
      for (var c = 0; c < NUM_COLS; c++) {
        var wx = startX + c * COL_SPACING;
        var pTop = project3D(wx, COL_TOP_Y, 0);
        var pBot = project3D(wx, COL_BOTTOM_Y, 0);
        cols.push({ wx: wx, pTop: pTop, pBot: pBot });
      }
      cols.sort(function (a, b) { return a.pTop.z - b.pTop.z; });

      for (var i = 0; i < cols.length; i++) {
        var col = cols[i];
        var halfWTop = (COL_TUBE_W / 2) * col.pTop.scale;
        var halfWBot = (COL_TUBE_W / 2) * col.pBot.scale;
        var capRyTop = Math.max(1.5, 3.6 * col.pTop.scale * (0.35 + Math.abs(Math.sin(camPitch)) * 0.85));
        var capRyBot = Math.max(1.5, 3.6 * col.pBot.scale * (0.35 + Math.abs(Math.sin(camPitch)) * 0.85));

        ctx.beginPath();
        ctx.moveTo(col.pTop.x - halfWTop, col.pTop.y);
        ctx.lineTo(col.pTop.x + halfWTop, col.pTop.y);
        ctx.lineTo(col.pBot.x + halfWBot, col.pBot.y);
        ctx.lineTo(col.pBot.x - halfWBot, col.pBot.y);
        ctx.closePath();
        ctx.fillStyle = "rgba(255, 255, 255, 0.24)";
        ctx.fill();
        ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
        ctx.lineWidth = 1.2;
        ctx.stroke();

        ctx.beginPath();
        ctx.ellipse(col.pTop.x, col.pTop.y, halfWTop, capRyTop, 0, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255, 255, 255, 0.35)";
        ctx.fill();
        ctx.strokeStyle = "rgba(255, 255, 255, 0.85)";
        ctx.stroke();

        ctx.beginPath();
        ctx.ellipse(col.pBot.x, col.pBot.y, halfWBot, capRyBot, 0, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(255, 255, 255, 0.75)";
        ctx.stroke();
      }
    }

    function drawSphereWireframe3D(rScreen) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(CX, CY, rScreen, 0, Math.PI * 2);
      ctx.clip();

      ctx.strokeStyle = "rgba(255, 255, 255, 0.24)";
      ctx.lineWidth = 1.1;

      var latAngles = [-0.55, 0, 0.55];
      for (var l = 0; l < latAngles.length; l++) {
        var lat = latAngles[l];
        var yOff = Math.sin(lat) * SPHERE_R;
        var ringR = Math.cos(lat) * SPHERE_R;
        ctx.beginPath();
        for (var i = 0; i <= 48; i++) {
          var theta = (i / 48) * Math.PI * 2;
          var p = project3D(CX + Math.cos(theta) * ringR, CY + yOff, Math.sin(theta) * ringR);
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();
      }

      var lonAngles = [0, Math.PI / 3, (2 * Math.PI) / 3];
      for (var m = 0; m < lonAngles.length; m++) {
        var lon = lonAngles[m];
        ctx.beginPath();
        for (var j = 0; j <= 48; j++) {
          var phi = (j / 48) * Math.PI * 2;
          var rx = Math.cos(phi) * SPHERE_R;
          var ry = Math.sin(phi) * SPHERE_R;
          var p2 = project3D(CX + rx * Math.cos(lon), CY + ry, rx * Math.sin(lon));
          if (j === 0) ctx.moveTo(p2.x, p2.y);
          else ctx.lineTo(p2.x, p2.y);
        }
        ctx.stroke();
      }
      ctx.restore();
    }

    function render3DScene() {
      if (!ctx) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      var sphereRScreen = SPHERE_R * camZoom;

      var standTop = project3D(CX, SPHERE_BOTTOM_Y + 4, 0);
      var standBot = project3D(CX, SPHERE_BOTTOM_Y + 76, 0);
      var topRx = 66 * standTop.scale;
      var botRx = 84 * standBot.scale;
      var ringRy = Math.max(5, 11 * standTop.scale * (0.5 + Math.abs(Math.sin(camPitch)) * 0.8));

      var standGrad = ctx.createLinearGradient(standTop.x - botRx, 0, standTop.x + botRx, 0);
      standGrad.addColorStop(0, "#334155");
      standGrad.addColorStop(0.35, "#e2e8f0");
      standGrad.addColorStop(0.7, "#64748b");
      standGrad.addColorStop(1, "#1e293b");
      ctx.beginPath();
      ctx.moveTo(standTop.x - topRx, standTop.y);
      ctx.lineTo(standTop.x + topRx, standTop.y);
      ctx.lineTo(standBot.x + botRx, standBot.y);
      ctx.lineTo(standBot.x - botRx, standBot.y);
      ctx.closePath();
      ctx.fillStyle = standGrad;
      ctx.fill();

      ctx.beginPath();
      ctx.ellipse(standTop.x, standTop.y, topRx * 1.15, ringRy, 0, 0, Math.PI * 2);
      ctx.fillStyle = "#f97316";
      ctx.fill();

      var leftTubeX = 26;
      var rightTubeX = 334;
      var tubeTopY = CY - 22;
      var tubeBottomY = SPHERE_BOTTOM_Y + 22;

      var pTopL0 = project3D(CX - 14, SPHERE_TOP_Y + 2, 0);
      var pTopL1 = project3D(CX - 120, SPHERE_TOP_Y + 6, 0);
      var pTopL2 = project3D(leftTubeX, tubeTopY, 0);
      var pBotL = project3D(leftTubeX, tubeBottomY, 0);

      ctx.beginPath();
      ctx.moveTo(pTopL0.x, pTopL0.y);
      ctx.quadraticCurveTo(pTopL1.x, pTopL1.y, pTopL2.x, pTopL2.y);
      ctx.lineTo(pBotL.x, pBotL.y);
      ctx.lineWidth = 17 * camZoom;
      ctx.strokeStyle = exitSide === "left" ? "rgba(59, 130, 246, 0.34)" : "rgba(255, 255, 255, 0.22)";
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.stroke();
      ctx.lineWidth = 1.8;
      ctx.strokeStyle = exitSide === "left" ? "#60a5fa" : "rgba(255,255,255,0.6)";
      ctx.stroke();

      var pTopR0 = project3D(CX + 14, SPHERE_TOP_Y + 2, 0);
      var pTopR1 = project3D(CX + 120, SPHERE_TOP_Y + 6, 0);
      var pTopR2 = project3D(rightTubeX, tubeTopY, 0);
      var pBotR = project3D(rightTubeX, tubeBottomY, 0);

      ctx.beginPath();
      ctx.moveTo(pTopR0.x, pTopR0.y);
      ctx.quadraticCurveTo(pTopR1.x, pTopR1.y, pTopR2.x, pTopR2.y);
      ctx.lineTo(pBotR.x, pBotR.y);
      ctx.lineWidth = 17 * camZoom;
      ctx.strokeStyle = exitSide === "right" ? "rgba(59, 130, 246, 0.34)" : "rgba(255, 255, 255, 0.22)";
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.stroke();
      ctx.lineWidth = 1.8;
      ctx.strokeStyle = exitSide === "right" ? "#60a5fa" : "rgba(255,255,255,0.6)";
      ctx.stroke();

      for (var li = 0; li < storedLeftBalls.length; li++) {
        var lb = storedLeftBalls[li];
        drawProjectedBall(leftTubeX, tubeBottomY - li * (BALL_R * 2.05), 0, BALL_R, lb.num, lb.color);
      }

      for (var ri = 0; ri < storedRightBalls.length; ri++) {
        var rb = storedRightBalls[ri];
        drawProjectedBall(rightTubeX, tubeBottomY - ri * (BALL_R * 2.05), 0, BALL_R, rb.num, rb.color);
      }

      var sphereGrad = ctx.createRadialGradient(
        CX - sphereRScreen * 0.35,
        CY - sphereRScreen * 0.35,
        sphereRScreen * 0.1,
        CX,
        CY,
        sphereRScreen
      );
      sphereGrad.addColorStop(0, "rgba(255, 255, 255, 0.48)");
      sphereGrad.addColorStop(0.65, "rgba(226, 232, 240, 0.16)");
      sphereGrad.addColorStop(1, "rgba(71, 85, 105, 0.45)");
      ctx.beginPath();
      ctx.arc(CX, CY, sphereRScreen, 0, Math.PI * 2);
      ctx.fillStyle = sphereGrad;
      ctx.fill();

      drawSphereWireframe3D(sphereRScreen);
      drawFiveTransparentColumns3D();

      var pCylTop = project3D(CX, SPHERE_TOP_Y, 0);
      var pCylBot = project3D(CX, SPHERE_BOTTOM_Y, 0);
      var cylHalfW = (CYL_W / 2) * camZoom;

      ctx.beginPath();
      ctx.moveTo(pCylTop.x - cylHalfW, pCylTop.y);
      ctx.lineTo(pCylTop.x + cylHalfW, pCylTop.y);
      ctx.lineTo(pCylBot.x + cylHalfW, pCylBot.y);
      ctx.lineTo(pCylBot.x - cylHalfW, pCylBot.y);
      ctx.closePath();
      ctx.fillStyle = "rgba(255, 255, 255, 0.22)";
      ctx.fill();
      ctx.strokeStyle = "rgba(255, 255, 255, 0.78)";
      ctx.lineWidth = 1.4;
      ctx.stroke();

      var pPistonTop = project3D(CX, cylTopY, 0);
      var pPistonBot = project3D(CX, SPHERE_BOTTOM_Y + 5, 0);
      if (pPistonBot.y > pPistonTop.y) {
        var pw = cylHalfW - 1.2;
        ctx.beginPath();
        ctx.moveTo(pPistonTop.x - pw, pPistonTop.y);
        ctx.lineTo(pPistonTop.x + pw, pPistonTop.y);
        ctx.lineTo(pPistonBot.x + pw, pPistonBot.y);
        ctx.lineTo(pPistonBot.x - pw, pPistonBot.y);
        ctx.closePath();
        ctx.fillStyle = "rgba(241, 245, 249, 0.9)";
        ctx.fill();
        ctx.strokeStyle = "#475569";
        ctx.stroke();
      }

      var arm1A = project3D(
        CX - Math.cos(crossAngle) * maxCrossHalfSpan,
        CROSS_Y,
        -Math.sin(crossAngle) * maxCrossHalfSpan
      );
      var arm1B = project3D(
        CX + Math.cos(crossAngle) * maxCrossHalfSpan,
        CROSS_Y,
        Math.sin(crossAngle) * maxCrossHalfSpan
      );
      var arm2A = project3D(
        CX - Math.cos(crossAngle + Math.PI / 2) * maxCrossHalfSpan,
        CROSS_Y,
        -Math.sin(crossAngle + Math.PI / 2) * maxCrossHalfSpan
      );
      var arm2B = project3D(
        CX + Math.cos(crossAngle + Math.PI / 2) * maxCrossHalfSpan,
        CROSS_Y,
        Math.sin(crossAngle + Math.PI / 2) * maxCrossHalfSpan
      );
      var pHub = project3D(CX, CROSS_Y, 0);

      ctx.beginPath();
      ctx.moveTo(arm1A.x, arm1A.y);
      ctx.lineTo(arm1B.x, arm1B.y);
      ctx.lineWidth = 6 * camZoom;
      ctx.lineCap = "round";
      ctx.strokeStyle = "#e2e8f0";
      ctx.stroke();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = "#334155";
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(arm2A.x, arm2A.y);
      ctx.lineTo(arm2B.x, arm2B.y);
      ctx.lineWidth = 6 * camZoom;
      ctx.lineCap = "round";
      ctx.strokeStyle = "#cbd5e1";
      ctx.stroke();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = "#1e293b";
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(pHub.x, pHub.y, 5 * camZoom, 0, Math.PI * 2);
      ctx.fillStyle = (phase === "PRE_LIFT_STOP" || phase === "LIFTING_AND_RETURNING") ? "#f59e0b" : "#ef4444";
      ctx.fill();

      var projectedBalls = balls
        .map(function (b) { return { b: b, depth: project3D(b.x, b.y, b.z || 0).z }; })
        .sort(function (a, b) { return a.depth - b.depth; });

      for (var k = 0; k < projectedBalls.length; k++) {
        var item = projectedBalls[k];
        drawProjectedBall(item.b.x, item.b.y, item.b.z || 0, BALL_R, item.b.num, item.b.color);
      }

      if (carriedBall) {
        drawProjectedBall(carriedBall.x, carriedBall.y, 0, BALL_R + 0.4, carriedBall.num, carriedBall.color);
      }

      ctx.beginPath();
      ctx.arc(CX, CY, sphereRScreen, 0, Math.PI * 2);
      ctx.lineWidth = 4.5;
      ctx.strokeStyle = "#f1f5f9";
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(CX, CY, sphereRScreen - 8 * camZoom, -Math.PI * 0.78, -Math.PI * 0.44);
      ctx.lineWidth = 3;
      ctx.strokeStyle = "rgba(255, 255, 255, 0.55)";
      ctx.stroke();

      if (exitingBall) {
        var t = exitingBall.t;
        var targetIndex = exitingBall.side === "left"
          ? storedLeftBalls.length
          : storedRightBalls.length;
        var endY = tubeBottomY - targetIndex * (BALL_R * 2.05);
        var endX = exitingBall.side === "left" ? leftTubeX : rightTubeX;

        var p0 = { x: CX, y: SPHERE_TOP_Y + 2 };
        var p1 = exitingBall.side === "left"
          ? { x: CX - 120, y: SPHERE_TOP_Y + 6 }
          : { x: CX + 120, y: SPHERE_TOP_Y + 6 };
        var p2 = { x: endX, y: Math.max(tubeTopY, endY) };

        var wx = (1 - t) * (1 - t) * p0.x + 2 * (1 - t) * t * p1.x + t * t * p2.x;
        var wy = (1 - t) * (1 - t) * p0.y + 2 * (1 - t) * t * p1.y + t * t * p2.y;
        drawProjectedBall(wx, wy, 0, BALL_R, exitingBall.num, exitingBall.color);
      }
    }

    function loop() {
      try {
        updatePhysics();
        render3DScene();
      } catch (err) {
        showErrorOnCanvas(err && err.message ? err.message : err);
        return;
      }
      requestAnimationFrame(loop);
    }

    function renderResults() {
      ballsRow.innerHTML = "";
      var mainSix = drawnOrder.slice(0, Math.min(6, drawnOrder.length)).sort(function (a, b) { return a - b; });

      for (var i = 0; i < mainSix.length; i++) {
        var n = mainSix[i];
        var div = document.createElement("div");
        div.className = "res-ball";
        div.dataset.num = String(n).padStart(2, "0");
        div.style.background = getBallColor(n).main;
        ballsRow.appendChild(div);
      }

      if (drawnOrder.length === 7) {
        var plus = document.createElement("span");
        plus.className = "plus";
        plus.textContent = "＋";
        ballsRow.appendChild(plus);

        var sp = drawnOrder[6];
        var spDiv = document.createElement("div");
        spDiv.className = "res-ball";
        spDiv.dataset.num = String(sp).padStart(2, "0");
        spDiv.style.background = getBallColor(sp).main;
        ballsRow.appendChild(spDiv);
      }

      orderText.textContent =
        "出球順序：" + drawnOrder.map(function (num) { return String(num).padStart(2, "0"); }).join(" → ");
    }

    function sleep(ms) {
      return new Promise(function (r) { setTimeout(r, ms); });
    }

    async function dropColumnsIntoSphere() {
      phase = "DROPPING";
      hideStatus();
      await sleep(750);
    }

    function captureBallOnCylinder() {
      var catchY = CY + 14;
      balls.sort(function (a, b) {
        var da = Math.hypot(a.x - CX, a.y - catchY, a.z || 0);
        var db = Math.hypot(b.x - CX, b.y - catchY, b.z || 0);
        return da - db;
      });
      var captured = balls.splice(0, 1)[0];
      return captured;
    }

    async function liftExitAndReturnCylinder(captured) {
      phase = "LIFTING_AND_RETURNING";
      var startTopY = CY + 14 + BALL_R;
      var endTopY = SPHERE_TOP_Y + 3 + BALL_R;
      var restTopY = SPHERE_BOTTOM_Y - 5;

      cylTopY = startTopY;
      carriedBall = {
        num: captured.num,
        color: captured.color,
        x: CX,
        y: startTopY - BALL_R
      };

      var liftFrames = 26;
      for (var f = 1; f <= liftFrames; f++) {
        var p = f / liftFrames;
        var curTop = startTopY + (endTopY - startTopY) * p;
        cylTopY = curTop;
        carriedBall.x = CX;
        carriedBall.y = curTop - BALL_R;
        await sleep(22);
      }

      carriedBall = null;
      exitingBall = {
        num: captured.num,
        color: captured.color,
        t: 0,
        side: exitSide
      };

      var exitFrames = 24;
      for (var g = 1; g <= exitFrames; g++) {
        var q = g / exitFrames;
        exitingBall.t = q;
        cylTopY = endTopY + (restTopY - endTopY) * q;
        await sleep(22);
      }

      if (exitSide === "left") {
        storedLeftBalls.push({ num: captured.num, color: captured.color });
      } else {
        storedRightBalls.push({ num: captured.num, color: captured.color });
      }

      exitingBall = null;
      cylTopY = restTopY;
    }

    async function startDraw() {
      if (isRunning) return;
      loadQuotaState();

      if (quotaState.remainingTrials <= 0) {
        openAdModal();
        return;
      }

      quotaState.remainingTrials -= 1;
      quotaState.lastSeenMs = Math.max(quotaState.lastSeenMs, Date.now());
      saveQuotaState();
      renderQuotaUI();

      isRunning = true;
      startBtn.disabled = true;
      resetBtn.disabled = true;
      syncParams();

      var customSec = parseFloat(stirSecInput.value);
      if (isNaN(customSec) || customSec < 0.2) customSec = 0.2;
      if (customSec > 60) customSec = 60;
      stirSecInput.value = customSec;

      arrangeFiveColumnsOnTop();
      await dropColumnsIntoSphere();

      for (var step = 1; step <= 7; step++) {
        phase = "STIRRING";
        hideStatus();
        await sleep(customSec * 1000);

        phase = "PRE_LIFT_STOP";
        hideStatus();
        await sleep(2000);

        var captured = captureBallOnCylinder();
        hideStatus();
        await liftExitAndReturnCylinder(captured);

        drawnOrder.push(captured.num);
        renderResults();
      }

      phase = "DONE";
      hideStatus();
      isRunning = false;
      startBtn.disabled = false;
      resetBtn.disabled = false;
    }

    try {
      loadQuotaState();
      buildIndividualMassInputs();
      syncParams();
      arrangeFiveColumnsOnTop();
      loop();
    } catch (e) {
      showErrorOnCanvas(e && e.message ? e.message : e);
    }
  </script>
</body>
</html>
